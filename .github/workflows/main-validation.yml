name: Main Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Plan Validation
    runs-on: ubuntu-latest
    outputs:
      benchmark_matrix: ${{ steps.plan.outputs.benchmark_matrix }}
      has_tools: ${{ steps.plan.outputs.has_tools }}
      run_validate: ${{ steps.plan.outputs.run_validate }}
      run_install_smoke: ${{ steps.plan.outputs.run_install_smoke }}
      run_benchmarks: ${{ steps.plan.outputs.run_benchmarks }}
      run_fixture_verify: ${{ steps.plan.outputs.run_fixture_verify }}
      change_class: ${{ steps.plan.outputs.change_class }}
      cache_epoch: ${{ steps.cache-epoch.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute benchmark cache epoch
        id: cache-epoch
        shell: bash
        run: |
          echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Build validation plan
        id: plan
        shell: bash
        run: |
          bash ./scripts/benchmark-discover.sh \
            --mode main \
            --event-name "${{ github.event_name }}" \
            --base-sha "${{ github.event.before || '' }}" \
            --head-sha "${{ github.sha }}" \
            --output-file "$GITHUB_OUTPUT" \
            --summary-file "${GITHUB_STEP_SUMMARY:-}"

  validate:
    needs: plan
    if: needs.plan.outputs.run_validate == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache validation tool builds and lint state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .gocache
            .cache/golangci-lint
          key: validation-tools-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', './scripts/validate.sh', '.github/workflows/main-validation.yml', '.github/workflows/pr-validation.yml') }}
          restore-keys: |
            validation-tools-${{ runner.os }}-

      - name: Download locked dependencies
        shell: bash
        run: |
          go mod download

      - name: Run local validation helper
        shell: bash
        run: |
          ./scripts/validate.sh

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" && -f .artifacts/coverage/summary.md ]]; then
            cat .artifacts/coverage/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

  smoke-installed-binary:
    name: Smoke Installed Binary / ${{ matrix.os }}
    needs: [plan, validate]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.run_install_smoke == 'true' && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build and install cmdshape into runner PATH
        if: needs.validate.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/cmdshape-smoke-bin"
          mkdir -p "$install_dir"
          bin_path="$install_dir/cmdshape"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin_path="$install_dir/cmdshape.exe"
          fi
          go build -o "$bin_path" ./cmd/cmdshape
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run installed binary smoke script
        if: needs.validate.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/ci-smoke.sh

      - name: Check installer and bootstrap regressions for documentation changes
        if: needs.validate.result == 'skipped'
        shell: bash
        run: go test -count=1 ./internal/lifecycle -ginkgo.focus='install script|installer' -ginkgo.no-color -ginkgo.succinct

      - name: Ensure GNU wget is available for installer smoke
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v wget >/dev/null; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update && sudo apt-get install -y wget ;;
              macOS) brew install wget ;;
              Windows) choco install wget --yes --no-progress ;;
            esac
          fi
          wget --version

      - name: Smoke the checked-out installer with public release assets
        shell: bash
        run: bash ./scripts/ci-install-smoke.sh --public

  benchmark-tool:
    name: Benchmark (informational) / ${{ matrix.tool }}
    needs: plan
    if: needs.plan.outputs.run_benchmarks == 'true' && needs.plan.outputs.has_tools == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.benchmark_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Build cmdshape binary
        shell: bash
        run: |
          mkdir -p .bin
          go build -o .bin/cmdshape ./cmd/cmdshape
          echo "${GITHUB_WORKSPACE}/.bin" >> "$GITHUB_PATH"

      - name: Restore benchmark history cache
        id: benchmark-history-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .artifacts/benchmark-history/${{ matrix.tool }}
          key: benchmark-report-main-${{ matrix.tool }}-v2-${{ needs.plan.outputs.cache_epoch }}
          restore-keys: |
            benchmark-report-main-${{ matrix.tool }}-v2-

      - name: Run benchmark harness for tool
        id: run-benchmark
        shell: bash
        env:
          BENCH_YELLOW_OVERHEAD_ABS_MS: ${{ vars.BENCH_YELLOW_OVERHEAD_ABS_MS || '20' }}
          BENCH_YELLOW_OVERHEAD_REL_PCT: ${{ vars.BENCH_YELLOW_OVERHEAD_REL_PCT || '25' }}
          BENCH_YELLOW_MIN_NATIVE_MS: ${{ vars.BENCH_YELLOW_MIN_NATIVE_MS || '50' }}
        run: |
          set -euo pipefail
          tool="${{ matrix.tool }}"
          out_dir="${GITHUB_WORKSPACE}/.artifacts/benchmark/${tool}"
          history_dir="${GITHUB_WORKSPACE}/.artifacts/benchmark-history/${tool}"
          prev_report="${history_dir}/report.json"
          mkdir -p "$out_dir" "$history_dir"

          go run ./cmd/cmdshape-ci \
            -artifacts-dir "$out_dir" \
            -previous-report "$prev_report" \
            -tool "$tool"

          if [[ -f "${out_dir}/report.json" ]]; then
            cp "${out_dir}/report.json" "${history_dir}/report.json"
          fi

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "## Main Benchmark Summary (${tool})"
              echo ""
              echo "- Result: success"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Delete benchmark history cache key
        if: always() && steps.run-benchmark.outcome == 'success' && github.event_name == 'push' && github.ref_name == 'main'
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key="benchmark-report-main-${{ matrix.tool }}-v2-${{ needs.plan.outputs.cache_epoch }}"
          curl --silent --show-error --fail-with-body \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?key=${key}&ref=refs/heads/main"

      - name: Save benchmark history cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always() && steps.run-benchmark.outcome == 'success' && github.event_name == 'push' && github.ref_name == 'main'
        with:
          path: .artifacts/benchmark-history/${{ matrix.tool }}
          key: benchmark-report-main-${{ matrix.tool }}-v2-${{ needs.plan.outputs.cache_epoch }}

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: proxy-benchmark-main-${{ matrix.tool }}
          path: .artifacts/benchmark/${{ matrix.tool }}
          retention-days: 14

  fixture-correctness:
    name: Fixture Correctness / ${{ matrix.tool }}
    needs: plan
    if: needs.plan.outputs.run_fixture_verify == 'true' && needs.plan.outputs.has_tools == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.benchmark_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
      - name: Build cmdshape binary
        shell: bash
        run: |
          mkdir -p .bin
          go build -o .bin/cmdshape ./cmd/cmdshape
          echo "${GITHUB_WORKSPACE}/.bin" >> "$GITHUB_PATH"
      - name: Verify fixture correctness
        shell: bash
        run: |
          go run ./cmd/cmdshape-ci -fixture-correctness -tool "${{ matrix.tool }}"

  sonarqube-scan:
    name: SonarQube Scan (informational)
    needs: [plan, validate]
    if: needs.plan.outputs.run_validate == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Generate internal coverage profile for Sonar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/coverage
          go test -count=1 -covermode=atomic -coverpkg=./internal/... -coverprofile=.artifacts/coverage/internal.cover ./...

      - name: Validate SonarQube configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "SONAR_TOKEN is not configured. Add SONAR_TOKEN in repository secrets/environment to run SonarQube scan." >&2
            exit 1
          fi
          if [[ ! -f sonar-project.properties ]]; then
            echo "sonar-project.properties is missing from repository root." >&2
            exit 1
          fi
          if [[ ! -f .artifacts/coverage/internal.cover ]]; then
            echo "coverage profile missing at .artifacts/coverage/internal.cover." >&2
            exit 1
          fi

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
